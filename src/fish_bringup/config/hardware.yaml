# 实机配置模板：DYNAMIXEL XW430-T200（IP68 防水，RS485，Protocol 2.0）。
# 实测运行环境为 Jetson Nano 4GB + Ubuntu 18.04 + ROS 1 Melodic；
# 端口与权限在这台 SoC 上配置，与开发机无关。
# 使用前必须确认：
#   1. 舵机已设为 Position Control Mode，ID 与 motors/ids 一致；
#   2. bus/baudrate 与舵机 EEPROM 内 Baud Rate 一致（工厂默认 57600）；
#   3. bus/device 指向 SoC 上的适配器（U2D2 常见 /dev/ttyUSB0；
#      CDC-ACM 适配器可能是 /dev/ttyACM0，用 ls /dev/tty{USB,ACM}* 确认），
#      运行用户需在 dialout 组或有对应 udev 规则；
#   4. 已断电手动标定 zero_raw / direction / external_ratio 与 mapping 增益、限位；
#   5. 仅在确认机械安全、急停可用后，才把 calibration/confirmed 改为 true。
# confirmation 为 false 时 arm 会被拒绝，不会输出扭矩。
backend: dynamixel
timing:
  control_hz: 100.0
  telemetry_hz: 50.0

motors:
  # 实机方位：1=左上，2=右上，3=左下，4=右下。
  names: [fin_0, fin_1, fin_2, fin_3]
  ids: [1, 2, 3, 4]

gait:
  waveform: fluent_asymmetric_delayed
  amplitude_model: 0.20
  frequency_hz: 0.5
  tf_coeff: 0.65
  body_coeff: 0.5

geometry:
  # 只保留前后两组安装位置：ID1/2 为前电机 x=0，ID3/4 为后电机 x=0.30。
  # 真机体长 550 mm 与 UDF 的 0.55 m 一致，前后摆轴中心距 d=300 mm 可直接作为模型坐标。
  x_model: [0.0, 0.0, 0.30, 0.30]
  model_unit: fluent_model_unit

mapping:
  kind: linear_calibrated
  # A_max=0.20，R_front=420 mm：θ_max=asin(0.20/0.42)=28.437°，gain=2.4816。
  # 后电机复用前电机摆角波形，仅相位滞后 98.2°；后摆杆 210 mm 只影响端点位移。
  gain_rad_per_model_unit: [2.4816, 2.4816, 2.4816, 2.4816]
  offset_rad: [0.0, 0.0, 0.0, 0.0]

calibration:
  # 绝对中点标定：ID1/ID2 取 180°→2048 counts，ID3/ID4 取 120°→1365 counts。
  # 1=左上，2=右上，3=左下，4=右下。
  zero_raw: [2048, 2048, 1365, 1365]
  # 下扑为正：ID1/ID4 raw 增大，ID2/ID3 raw 减小。
  direction: [1, -1, -1, 1]
  external_ratio: [1.0, 1.0, 1.0, 1.0]
  # 已完成零点、力臂与摆角标定，允许 arm/start。
  confirmed: true

# 平放=0，上=-π/2，下=+π/2；当前四台波形峰值均为 28.44°，位于 ±90° 限位内。
# A_max 与前电机力臂决定摆幅 θ_max = asin(A_max / R_front)；后电机复用同一摆角波形，
# 仅相位滞后。软件限位取机械端点并留余量，不能直接等于波形峰值。
limits:
  min_rad: [-1.5707963, -1.5707963, -1.5707963, -1.5707963]
  max_rad: [1.5707963, 1.5707963, 1.5707963, 1.5707963]
  max_velocity_rad_s: [4.0, 4.0, 4.0, 4.0]
  max_acceleration_rad_s2: [20.0, 20.0, 20.0, 20.0]
  current_trip_a: [1.0, 1.0, 1.0, 1.0]
  current_trip_duration_s: 0.2
  temperature_trip_c: [70.0, 70.0, 70.0, 70.0]
  min_voltage_v: [10.0, 10.0, 10.0, 10.0]
  max_voltage_v: [14.8, 14.8, 14.8, 14.8]

safety:
  feedback_timeout_s: 0.2
  # U2D2 一次同步读约 40~56 ms，200 ms 看门狗在 100 Hz 控制 + 50 Hz 遥测下会被
  # 偶发 USB/调度停顿误触发（实测曾报 bus_write_watchdog）；放宽到 1000 ms。
  bus_watchdog_ms: 1000
  normal_stop_policy: hold_position
  require_recording: true

bus:
  # U2D2 的稳定设备名，由 udev 规则 99-fish-u2d2.rules 绑定（序列号 FTA9DPMX）。
  device: /dev/fish_u2d2
  # 实测四台 XW430-T200 当前均为 115200；改 EEPROM 后同步此处。
  baudrate: 115200
  protocol_version: 2.0
